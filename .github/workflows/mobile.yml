# The Flutter app (apps/mobile): tests on every change, plus a build for each platform so a broken
# native project is caught here and not on release day. See apps/mobile/README.md.
name: Mobile app

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the version in apps/mobile/README.md.
  FLUTTER_VERSION: 3.38.2

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # With the four ANDROID_* secrets set, the bundle is signed with the upload key and can go to
      # Google Play as is. Without them (forks, pull requests) it is signed with the debug key:
      # still a full release build, but Play rejects it.
      - name: Upload key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "signed=upload-key" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: bluelytics-android-${{ steps.key.outputs.signed }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS build (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Compiles and links the app with CocoaPods and Xcode, without a signing identity. The signed
      # build for the App Store is made on a Mac (apps/mobile/README.md).
      - run: flutter build ios --release --no-codesign
