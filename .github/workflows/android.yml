# The native Android app (apps/android): unit and interface tests, lint, and the release bundle and
# APK. See apps/android/README.md.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/android

jobs:
  android:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Keep in step with tool/Dockerfile and compileSdk in app/build.gradle.kts.
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      # With the four ANDROID_* secrets set, the bundle is signed with the upload key and can go to
      # Google Play as is. Without them (forks, pull requests) it is signed with the debug key.
      - name: Upload key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "signed=upload-key" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
          fi
      - name: Test, lint and build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bluelytics-android-${{ steps.key.outputs.signed }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
