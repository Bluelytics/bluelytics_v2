union PostMetadata = InstagramPostMetadata | FacebookPostMetadata | LinkedInPostMetadata | TwitterPostMetadata | PinterestPostMetadata | GoogleBusinessPostMetadata | YoutubePostMetadata | MastodonPostMetadata | TiktokPostMetadata | ThreadsPostMetadata | BlueskyPostMetadata | SubstackPostMetadata # Post metadata union type. Contains all possible types of post metadata.

type PostMetric { # A single metric for a post (or an entry in an aggregated metrics response).
  description: String! # A human-readable description of what the metric represents.
  name: String! # The human-readable name of the metric (e.g. "Reactions", "Eng. Rate").
  type: PostMetricType! # The type of metric. Cross-network metrics use unified naming (`reactions`, `comments`, etc.); network-specific metrics retain their network's vocabulary (`saves`, `quotes`, etc.). See `PostMetricType` for the full catalog including deprecated values.
  unit: PostMetricUnit! # The unit (count vs percentage) of `value`.
  value: Float! # The metric value. Defaults to 0 when the network did not report the metric.
}

enum PostMetricType { # List of possible metrics available for a Post.  Values fall into three groups: - **Cross-network normalized** (reactions, comments, shares, reposts, reach, impressions, views, clicks, engagementRate): Used wherever a concept maps cleanly across networks. Per-network adapters normalize their native names (e.g., Instagram `likes` → `reactions`, Twitter `retweets` → `reposts`). - **Network-specific** (saves, follows, quotes, viewers, totalTimeWatched, averageTimeWatched, likes, freeSubscriptions, paidSubscriptions): Real metrics that don't have a cross-network equivalent. `likes` is intentionally distinct from `reactions` on Facebook — Facebook's Graph API surfaces them separately. `freeSubscriptions` and `paidSubscriptions` are Substack's per-Note subscription attribution; no other network reports it. - **Aggregation-only** (postCount): Meaningful only on aggregate endpoints; never emitted per-post.  Deprecated values are pre-normalization legacy or tied to features being removed. They're kept in the enum for backwards compatibility until clients migrate.
  averageTimeWatched # Average time watched, in seconds, for video-style posts (TikTok, Instagram Reels).
  clicks # How many times people clicked on your post.
  comments # The count of comments and replies on your post. Unified across networks (Threads `replies` maps here).
  engagementRate # The percentage of people who interacted with your post compared to how many saw it. Unit: percentage.
  favorites @deprecated # Deprecated: not emitted by any per-network definition. Use `reactions` instead — Twitter and Mastodon favorites normalize into `reactions`. Will be removed on 2026-12-01.
  follows # The number of new followers gained from this post (Instagram).
  freeSubscriptions # The number of free subscriptions Substack attributes to this Note.
  impressions # How many times your post was shown on screen. May include multiple views by the same person — useful for spotting how often the content gets surfaced.
  likes # The Like-reaction subcount on Facebook. Distinct from `reactions` (which is the total of all reaction types — Like, Love, Care, Haha, Wow, Sad, Angry); Facebook's Graph API reports them separately and we mirror that.
  link_clicks @deprecated # Deprecated: StartPage link-clicks metric. StartPage is being deprecated as a product. Will be removed on 2026-12-01.
  other @deprecated # Deprecated catch-all from pre-normalization. Never emitted. Will be removed on 2026-12-01.
  paidSubscriptions # The number of paid subscriptions Substack attributes to this Note.
  postCount # The count of posts included in an aggregated response. Only meaningful on aggregate endpoints — never emitted per-post.
  quotes # How many times your post was quoted (Threads).
  reach # The number of unique people who saw your post.
  reactions # How many people reacted to your post. Unified across networks: Instagram/Twitter `likes`, Mastodon `favorites`, etc. all map to this value.
  reblogs @deprecated # Deprecated: not emitted by any per-network definition. Use `reposts` instead — Mastodon reblogs normalize into `reposts`. Will be removed on 2026-12-01.
  repins @deprecated # Deprecated: not emitted by any per-network definition. Pre-normalization legacy from the Pinterest era. Will be removed on 2026-12-01.
  replies @deprecated # Deprecated: not emitted by any per-network definition. Use `comments` instead — replies are normalized into `comments` on the networks that distinguish them (Threads). Will be removed on 2026-12-01.
  reposts # How many times your post was reposted by others. Twitter `retweets`, Mastodon `reblogs`, Threads `reposts` all normalize to this value.
  retweets @deprecated # Deprecated: not emitted by any per-network definition. Use `reposts` instead — Twitter retweets normalize into `reposts`. Will be removed on 2026-12-01.
  saves # How many times people saved your post (Instagram, Pinterest). A strong signal that the content is worth revisiting.
  shares # How many times your post was shared or forwarded by others.
  totalTimeWatched # Total time watched, in minutes, for video-style posts (LinkedIn, TikTok, Instagram Reels).
  viewers # Unique viewer count for video-style posts (LinkedIn).
  views # How many times your post was viewed. Used for video-style posts and on networks that report views distinctly from impressions.
}

enum PostMetricUnit { # The unit representing the value of a PostMetric.
  count # An integer count (e.g. number of reactions, impressions, reach).
  percentage # A percentage value between 0 and 100 (e.g. engagement rate).
}

