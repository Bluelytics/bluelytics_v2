type Mutation {
  createSnippet(input: CreateSnippetInput!): CreateSnippetPayload! # Creates a snippet in an organization.
  deleteSnippet(input: DeleteSnippetInput!): DeleteSnippetPayload! # Deletes a snippet.
  updateSnippet(input: UpdateSnippetInput!): UpdateSnippetPayload! # Replaces the name and text of a snippet.
  createCollaborationNote(input: CreateCollaborationNoteInput!): CreateCollaborationNotePayload! # Creates a collaboration Note in a thread.
  deleteCollaborationNote(input: DeleteCollaborationNoteInput!): DeleteCollaborationNotePayload! # Deletes a collaboration Note.
  updateCollaborationNote(input: UpdateCollaborationNoteInput!): UpdateCollaborationNotePayload! # Updates a collaboration Note.
  createPost(input: CreatePostInput!): PostActionPayload! # Create post for channel
  deletePost(input: DeletePostInput!): DeletePostPayload! # Delete a post by id.
  editPost(input: EditPostInput!): PostActionPayload! # Edit post for channel
  movePostInQueue(input: MovePostInQueueInput!): MovePostInQueuePayload! # Move a queued post to the top or bottom of its channel's queue. Unlike editPost, this is a scheduling-only operation that never re-validates the post's content.
  publishPostNow(input: PublishPostNowInput!): PublishPostNowPayload! # Publish a post now without adding it to the queue. A draft, scheduled, needs-approval or error post is sent. A post that is already sending or sent returns UnauthorizedError. The mutation returns once the post is queued for publishing, usually with status sending. Read the post again to see whether it was sent; when the network refuses it, its status is error and its error field says why.
  addPostToContentItem(input: AddPostToContentItemInput!): AddPostToContentItemPayload! # Add a post that already exists to a content item. The mutation creates no post. To add a new post, call createPost first.
  createContentItem(input: CreateContentItemInput!): CreateContentItemPayload! # Create a content item together with all of its channel-specific post variants in a single operation. Validation is all-or-nothing: if any variant fails validation, no content item and no variants are created. Variants that fail while being processed after creation are reported per channel in the failure payload; the content item and its variants are still created in that case.  This API is an early preview and can change without a deprecation period.
  createContentItemDraft(input: CreateContentItemDraftInput!): CreateContentItemDraftPayload! # Create a content item holding a channel-less draft, before any channels are selected. No network-specific validation applies to the draft content. The draft needs text or at least one asset.  This API is an early preview and can change without a deprecation period.
  deleteContentItem(input: DeleteContentItemInput!): DeleteContentItemPayload! # Delete a content item: the item itself and any posts created from it. Deletion is all-or-nothing. Every post must be deletable on its own, or nothing is deleted and every blocked post is reported at once. A post can only be deleted while it is a draft, awaiting approval, scheduled, or failed, so an item cannot be deleted while any of its posts is publishing or already published. An item still holding a channel-less draft has no posts, so nothing blocks it. An error can also be reported when a post could not be fully processed after the deletion already took effect; re-fetch before retrying.  Deleting a content item also deletes the team notes on the item and on its posts. The notes are removed shortly after the item is deleted.  This API is an early preview and can change without a deprecation period.
  promoteContentItemDraftToPosts(input: PromoteContentItemDraftToPostsInput!): PromoteContentItemDraftToPostsPayload! # Promote a channel-less draft into channel-specific posts. One-way: once promoted, the content item can no longer be edited as a draft. If any post fails validation, none are created. A failure can also be reported when a post could not be fully processed after the promotion already took effect; re-fetch the content item to check its state before retrying.  This API is an early preview and can change without a deprecation period.
  removePostFromContentItem(input: RemovePostFromContentItemInput!): RemovePostFromContentItemPayload! # Remove a post from a content item. The post survives on its own channel and keeps its schedule, text, status, and tags. Only the link to the content item goes away. To delete a post, call deletePost.  A second call with a post that belongs to no content item changes nothing, and the mutation reports success.
  updateContentItem(input: UpdateContentItemInput!): UpdateContentItemPayload! # Update a content item's title or target date. Fields that are omitted keep their current value.  This API is an early preview and can change without a deprecation period.
  updateContentItemDraft(input: UpdateContentItemDraftInput!): UpdateContentItemDraftPayload! # Replace a channel-less draft's content in full, and optionally set the content item's target date in the same write. The draft needs text or at least one asset. Only valid while the content item is still a draft.  This API is an early preview and can change without a deprecation period.
  createTag(input: CreateTagInput!): CreateTagPayload! # Create a tag for an organization.  The name must be unique within the organization; a duplicate is refused with `DuplicateError`. Creation is refused with `LimitReachedError` once the organization already holds as many tags as its plan allows.  This API is an early preview and can change without a deprecation period.
  deleteTag(input: DeleteTagInput!): DeleteTagPayload! # Delete a tag.  The tag is removed from every post, idea and content item carrying it; those items are otherwise untouched. A locked tag can be deleted, and deleting an unlocked tag frees a slot for the oldest locked one. See `Tag.isLocked`.  This API is an early preview and can change without a deprecation period.
  updateTag(input: UpdateTagInput!): UpdateTagPayload! # Update a tag's name and color.  Both values are replaced, so send the current value for the one you are not changing. The new name must still be unique within the organization; a duplicate is refused with `DuplicateError`.  A locked tag cannot be edited and the update is refused. See `Tag.isLocked`.  This API is an early preview and can change without a deprecation period.
  createPostTemplate(input: CreatePostTemplateInput!): CreatePostTemplatePayload! # Create a post template visible only to the caller (`private`) or to the caller's organization (`internal`).
  deletePostTemplate(input: DeletePostTemplateInput!): DeletePostTemplatePayload! # Delete a post template owned by the caller (or an internal template in the caller's organization, if the caller is an org admin/owner).
  updatePostTemplate(input: UpdatePostTemplateInput!): UpdatePostTemplatePayload! # Update a post template owned by the caller (or an internal template in the caller's organization, if the caller is an org admin/owner).
  createIdea(input: CreateIdeaInput!): CreateIdeaPayload! # Create a new idea with the given content and metadata
}

