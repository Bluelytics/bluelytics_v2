# Buffer public GraphQL API schema, reconstructed from an unauthenticated introspection query
# against https://api.buffer.com on 2026-11-22. Descriptions are Buffer's own.

schema { query: Query mutation: Mutation }

type Account { # Account is a representation of a Buffer user.
  id: ID! # Unique identifier for the account
  email: String! # Primary email address for the account
  backupEmail: String # Backup email address for account recovery
  avatar: String! # URL to the account's avatar image
  createdAt: DateTime # Date the account was created in the Core DB. For older customers, it's possible a Publish account existed in the Publish DB for this customer before this date
  organizations(filter: OrganizationFilterInput): [Organization!]!
  timezone: String # The account-level timezone - this is used as a default input for streaks, posting plans, and new channel channel connections.
  name: String # The account name, different from the organization name
  preferences: Preferences # The accounts preferences
  connectedApps: [ConnectedApp!] # The connected apps for the account
}

scalar AccountId # The `AccountId` scalar represents the ID of a Buffer Account

input AddPostToContentItemInput { # Input for addPostToContentItem.
  id: ContentItemId! # The content item to add the post to.
  postId: PostId! # The post to add. The post must already exist. The post and the content item must belong to the same organization.
}

union AddPostToContentItemPayload = AddPostToContentItemSuccess | VoidMutationError # All possible responses for addPostToContentItem.

type AddPostToContentItemSuccess { # Successful addPostToContentItem response.
  contentItem: ContentItem! # The content item after the mutation added the post.
  post: Post! # The post after the mutation added it. Its contentItemId names this content item.
}

type AggregatedPostMetrics { # Aggregated post metrics across a filtered post set. Each entry in `metrics` mirrors the shape of a `Post.metrics` entry; the total number of matched posts is carried as a regular `PostMetric` entry with `type: postCount`.
  metrics: [PostMetric!]! # Normalized metric aggregates across the matched posts. Always includes a baseline trio (`postCount`, `reactions`, `comments`) — posts on networks that don't track reactions or comments contribute 0 to those totals. Beyond the baseline, additional metric types are included only when every channel in the filter set supports them.
  metricsUpdatedAt: DateTime # The latest `metricsUpdatedAt` across the matched posts, indicating the freshness of the aggregate. Metrics are refreshed daily, so values can be up to ~24h behind the source network. Null when no posts matched the filter.
}

input AggregatedPostMetricsInput { # Input for the `aggregatedPostMetrics` query.
  channelIds: [ChannelId!] # Optional list of channel IDs to filter by. When omitted (null), the aggregate spans every channel in the organization the actor has insights access to. When set to an empty array, no channels match and the result is empty.
  endDateTime: DateTime! # End of the aggregation window. Consumers typically pass UTC midnight of the last calendar day in the window (the backend treats the range as inclusive of that day), for example `2026-01-31T00:00:00Z`. Date range is capped to 365 days.
  organizationId: OrganizationId! # The organization ID
  startDateTime: DateTime! # Start of the aggregation window. Consumers typically pass UTC midnight of the first calendar day in the window, for example `2026-01-01T00:00:00Z`. Must be no more than 2 years before now; older requests are rejected.
  tags: TagComparator # Filter to posts with specific tags. When omitted, all posts are included regardless of tags.
}

enum AiFeature { # AI features supported for an engagement type. Grows additively.
  insights
  suggestions
}

type Annotation { # Annotation representing all the entities in the text
  content: String! # The content of the annotation. Annotations can sometimes be different from the actual text content. E.g., Mastodon mentions have 'text: @buffer', but includes the server name in the content, 'content: @buffer@threads.net'
  displayValue: String # The display value, when present
  indices: [Int!]! # The indices of the annotation in the text
  serviceEntityId: String # The service entity ID, when present
  text: String! # The text representation of the annotation, eg '@buffer'
  type: AnnotationType! # The type of the annotation
  url: String! # The URL the annotation points to. Empty string when the annotation has no link.
}

input AnnotationInput { # An annotation in text input.
  content: String! # The text content in the annotation span.
  displayValue: String # The display value, when present.
  indices: [Int!]! # The start and exclusive end offsets in the text.
  serviceEntityId: String # The service entity ID, when present.
  text: String! # The text representation of the annotation.
  type: AnnotationType! # The annotation type.
  url: String # The annotation URL, when present.
}

input AnnotationInputFacebook { # Annotation representing all the entities in the text
  content: String! # The content of the annotation, e.g. '107509875938399'
  indices: [Int!]! # The indices of the annotation in the text, e.g. [6, 9] (from 6 to 9 characters in the text)
  text: String! # The text representation of the annotation, eg 'Buffer'
  url: String! # The URL the annotation points to, e.g. https://www.facebook.com/107509875938399
}

input AnnotationInputLinkedIn { # Annotation representing all the entities in the text
  id: String! # The id of the annotation, e.g. 1521226
  entity: String! # The entity of the annotation, e.g. urn:li:organization:1521226
  length: Int! # The length of the annotation, e.g. 6
  link: String! # The link of the annotation, e.g. https://www.linkedin.com/company/bufferapp
  localizedName: String! # The localized name of the annotation, e.g. Buffer
  start: Int! # The start of the annotation, e.g. 5
  vanityName: String! # The vanity name of the annotation, e.g. bufferapp
}

enum AnnotationType { # List of possible types for an annotation
  annotation
  bold
  bulletedListItem
  cashtag
  hashtag
  heading
  italic
  mention
  orderedListItem
  strikethrough
  url
}

interface Asset { # Asset interface with common fields
  id: ID # The ID of the asset in the database
  mimeType: String! # The MIME type of the asset
  source: String! # URL to the file source
  thumbnail: String! # URL to the static thumbnail of the asset
  type: AssetType! # The type of the asset
}

input AssetInput { # A single entity's asset. Exactly one variant must be provided.
  document: DocumentAssetInput # Document asset
  image: ImageAssetInput # Image asset
  video: VideoAssetInput # Video asset
}

enum AssetType { # Asset types
  document
  image
  video
}

type Author { # Represent the author of a post or note.
  id: AccountId! # The unique identifier of the author.
  avatar: String! # The avatar URL of the author.
  email: String! # The email address of the author.
  isDeleted: Boolean! # Indicates whether the author is a deleted.
  name: String # The name of the author. Null if the user has not yet set a name.
  urn: String # The Buffer account URN for this author, in the form `urn:buffer:account:<account-id>`. Null when the author is deleted or the account ID is missing or invalid. A URN identifies an account. It does not prove that the account exists, that the caller has access, or that the account can be mentioned.
}

enum AuthorizationStatus { # Represents the authorization evaluation result for a feature.
  needsRefresh # Authorization exists but requires token refresh
  needsUpgrade # The client version is below the minimum required to access this feature. The client should prompt the user to upgrade.
  notEnoughData # Insufficient data to determine authorization state. Typically indicates missing scopes or webhook metadata.
  notEnoughRights # The connected platform user's role/permissions are insufficient for this feature, so reconnecting with the same user cannot fix it. Clients should prompt the user to contact an administrator of the platform account (or have one connect the channel) instead of offering a reconnect.
  ok # Authorization is valid and the feature can be used.
}

type BlueskyMetadata { # Bluesky metadata
  serverUrl: String! # The instance of bluesky of the channel
}

type BlueskyPostMetadata { # Bluesky post metadata
  annotations: [Annotation!]! # Annotations representing entities in the text
  linkAttachment: LinkAttachment # Link attachment
  thread: [ThreadedPost!]! # The list of threaded posts (not paginated)
  threadCount: Int! # The number of threaded posts
  type: PostType! # The channel-specific type of the post, eg, post, story, reel for Instagram
}

input BlueskyPostMetadataInput { # Bluesky post metadata
  linkAttachment: LinkAttachmentInput # Link attachment. Mutually exclusive with a non-empty `assets` array — input providing both is rejected.
  thread: [ThreadedPostInput!] # The ordered list of posts that make up the thread (not paginated). This array is the source of truth for what gets published: every post in the thread, including the root post, must be provided here. Posts are published in order, each replying to the previous one. The first item is the root post and should match the top-level `text` on the post input.
}

scalar Boolean # The `Boolean` scalar type represents `true` or `false`.

type Channel { # Channel entity
  id: ChannelId! # The ID of the channel Source: mapper from channel collection - channel._id Defined in: both proposals
  allowedActions: [ChannelAction!]! # The allowed actions for the current user Source: field resolver Defined in: new proposal
  avatar: String! # The avatar URL of the channel Source: mapper from channel collection - channel.avatar Defined in: both proposals
  descriptor: String! # Formatted name of the channel service and type: e.g. 'Twitter Profile' or 'Facebook Page' Source: mapper from channel collection - channel.service and channel.type Defined in: current implementation
  displayName: String # The display name of the channel - nullable (reason?) Source: mapper from channel collection - channel.displayName Defined in: current implementation
  externalLink: String # The channel's URL on the social network (e.g. instagram.com/username or facebook.com/page) Source: field resolver Returns null if the channel is not supported
  hasActiveMemberDevice: Boolean! # Whether at least one member of the orginization who have access to this channel also has a user device registered for push notifications
  isDisconnected: Boolean! # Indicates if the channel is properly connected to Buffer Source: mapper from channel collection - channel.credentials.invalid Defined in: both proposals
  isLocked: Boolean! # Indicates if the channel is locked - Locked channels can't be used for posting. A channel can be locked when the organization downgrades and reduces the channel quantity of their plan. Source: mapper from channel collection - channel.isLocked Defined in: both proposals
  isNew: Boolean! # Indicates if the channel was recently created (in less than 10 seconds). This is used to determine the redirect modal after channel authorization Source: mapper from channel collection - channel.createdAt comparison with current time Defined in: current implementation
  isQueuePaused: Boolean! # Indicates is the queue is paused for the channel. A paused queue means schedules posts won't be published. Source: Field resolver - From profiles collection - profile.paused Defined in: new proposal
  linkShortening: ChannelLinkShortening! # Link Shortening settings for the channel
  metadata: ChannelMetadata # Metadata or settings depending on the service type - such as the server URL for Mastodon or Location data for Facebook/GPB Source: Field resolver - From channel collection: channel.locationData + channel.serverURL | profile collection: profile.default_to_reminder Defined in: new proposal
  name: String! # The name of the channel - the handle name, username, etc. Source: mapper from channel collection - channel.name Defined in: both proposals
  organizationId: OrganizationId! # The organization ID of the channel Source: mapper from channel collection - channel.organizationId Defined in: both proposals
  postingGoal: PostingGoal # The posting goal for the channel
  postingSchedule: [ScheduleV2!]! # Provides the posting slots for each day of the week Source: field resolver based on profiles collection - getPostingSchedule
  products: [Product!] # Products that support a given channel
  scopes: [String]! # Scopes requested for a given channel - empty array if we don't have them tracked Source: mapper from channel collection - channel.credentials.scopes Defined in: current implementation
  service: Service! # Represents the social network Source: mapper from channel collection - channel.serviceType Defined in: both proposals
  serviceId: String! # Represents the external ID of the channel on social network API Source: mapper from channel collection - channel.serviceId Defined in: both proposals
  showTrendingTopicSuggestions: Boolean! # Indicates if trending topic suggestions should be shown in the composer. When false, users can still access trends via the trending icon button. Defaults to true for backward compatibility. Source: Field resolver - From profiles collection - profile.show_trending_topic_suggestions
  timezone: String! # The timezone of the channel - Default if not set is Europe/London Source: field resolver based on profiles collection - timezone Defined in: both proposals
  type: ChannelType! # The type of the channel - Page, Profile, Business, Group, Account, etc. Source: mapper from channel collection - channel.type Defined in: both proposals
  weeklyPostingLimit: WeeklyPostingLimit @deprecated # Weekly posting limit for the channel
  createdAt: DateTime! # The creation date of the channel Source: mapper from channel collection - channel.createdAt Defined in: both proposals
  updatedAt: DateTime! # The last time the channel was updated Source: mapper from channel collection - channel.updatedAt Defined in: both proposals
}

enum ChannelAction { # List of possible actions that can be performed on a Channel
  approvePosts
  backfillChannel
  cleanQueue # Delete every failed post of the channel, from every member.
  deleteDrafts # Delete every draft of the channel, from every member. Drafts awaiting approval stay.
  emptyQueue # Delete every queued and failed post of the channel, from every member.
  exportInsights
  interactWithTakeaways
  manageCapabilities
  manageChannelSettings
  manageComments
  manageDms
  manageIntegrations
  managePostingSchedule
  manageUpdates
  publishStartPage
  readUpdates
  reconnectChannel
  removeChannel
  scheduleUpdates
  shuffleQueue # Shuffle the order of the channel's queued posts.
  viewCapabilities
  viewChannel
  viewComments
  viewDms
  viewInsights
  viewPublish
  viewUpdates @deprecated
}

type ChannelConfiguration { # Everything for one connected channel: its engagement capabilities, its full `content` config, and per-feature authorization. Each channel carries its own complete config — there is no service-level default to merge against.
  authorizationStatus: [FeatureAuthorizationStatus!]! # Authorization status per feature for this channel. A feature is a capability a channel can expose — e.g. posting, commenting, mentions, insights (see the `Feature` enum).
  channelId: ChannelId! # The connected channel this config describes.
  channelType: ChannelType! # The channel's type within the service (e.g. profile, page, business).
  content: [ContentConfiguration!]! # Content config — one entry per content type, or a single entry grouping several types that share identical rules (post / story / reel / comment reply).
  engagement: [EngagementTypeConfiguration!]! # Engagement capabilities — one entry per engagement type. Empty when engagement isn't supported on the channel.
  service: Service! # The channel's social service (e.g. twitter, instagram).
}

scalar ChannelId # The `ChannelId` scalar represents the ID of a Buffer Channel

input ChannelInput { # Input for the channel query
  id: ChannelId! # The ID of the channel to be retrieved
}

type ChannelLinkShortening { # Settings for link shortening
  config: LinkShorteningConfig # Configuration of link shortening integration. Null if disabled.
  isEnabled: Boolean! # If link shortening is enabled for the channel
}

union ChannelMetadata = InstagramMetadata | TiktokMetadata | YoutubeMetadata | PinterestMetadata | MastodonMetadata | BlueskyMetadata | GoogleBusinessMetadata | FacebookMetadata | TwitterMetadata | LinkedInMetadata | WhatsAppMetadata # Metadata or settings about the channel depending on the service type

type ChannelRefreshRequired { # Error returned when the channel needs a refresh
  channelIds: [ChannelId!]! # ChannelIds that need refreshing
  message: String! # Error message
}

enum ChannelType { # Channel is a representation of a social media account or page that can be connected to Buffer.
  account
  business
  channel
  group
  page
  profile
}

input ChannelsFiltersInput { # Filter to pass when fetching channels.
  isLocked: Boolean # If not defined, it returns all channels Else,   if true, it only returns locked channels   if false, it only returns not locked channels
  product: Product # If not passed, it return all channels Else, it filters the channels based on what the product supports.
}

input ChannelsInput { # Input to pass when fetching channels.
  filter: ChannelsFiltersInput # A list of option filters - passing null means we don't want to filter
  organizationId: OrganizationId! # The Organization id to fetch channels for
}

type CollaborationNote { # A collaboration Note in a Post or ContentItem thread.
  id: NoteId! # The Note ID.
  allowedActions: [NoteAction!]! # The actions the current account can perform on the Note.
  annotations: [Annotation!]! # The annotations in the Note text.
  author: Author # The author, or null when the account no longer exists.
  authorId: AccountId! # The author's Account ID, including when the account no longer exists.
  text: String! # The Note text.
  createdAt: DateTime! # The date and time of Note creation.
  updatedAt: DateTime! # The date and time of the last Note update.
}

type CollaborationNoteEdge { # A Note and its pagination cursor.
  cursor: String! # The opaque cursor for this Note.
  node: CollaborationNote! # The Note.
}

input CollaborationNoteSubjectInput { # The entity whose Notes thread to use. Set exactly one field.
  contentItemId: ContentItemId # The ContentItem ID. Selects the ContentItem's own thread, not the threads of its Posts.
  postId: PostId # The Post ID.
}

type CollaborationNoteThreadClosedError { # Error returned when a Note is created in a thread that accepts no new Notes. Existing Notes in the thread stay readable.
  message: String! # Error message
}

type CollaborationNotesConnection { # A page of authorized Notes.
  edges: [CollaborationNoteEdge!]! # The Notes in this page.
  pageInfo: PaginationPageInfo! # The pagination information for this page.
}

input CollaborationNotesInput { # The Notes thread to read.
  subject: CollaborationNoteSubjectInput! # The entity whose Notes thread to read.
}

interface CommonPostMetadata { # Common properties for all post metadata types
  annotations: [Annotation!]! # Annotations representing entities in the text
  type: PostType! # The channel-specific type of the post, eg, post, story, reel for Instagram
}

type Configuration { # Organization configuration. `channels` carries the per-connected-channel config the actor can view (including per-`Feature` `authorizationStatus`); `services` carries the service-level capability catalog — the engagement and content config for every supported `service` + `channelType`, independent of which channels are connected (e.g. for composing before a channel is connected); `collaborationRoleAbilities` carries the Roles ability catalog.  `@public` is set per field rather than on the type, so a field is external only when tagged. A new field is internal until it carries its own `@public`.
  channels: [ChannelConfiguration!]! # Per-connected-channel config for every channel the actor can view.
  services: [ServiceConfiguration!]! # Service-level capability catalog for every supported service + channel type.
}

enum ConfigurationContentType { # The kinds of content a channel can compose. Grows additively.
  comment
  post
  reel
  story
}

input ConfigurationInput { # Input for the configuration query.
  organizationId: OrganizationId! # The organization to return configuration for.
}

type ConnectedApp { # Connected App
  category: ConnectedAppCategory # The category of the connected app, when known.
  clientId: ID! # The id of the connectedApp.
  description: String! # A brief description of the connected app.
  name: String! # The name of the connected app.
  scopes: [String!]! # The access scopes granted to this connection for Buffer's public API resources. Empty when the connection holds none.
  userId: ID! # The id of the user that has granted access to the app.
  website: String! # The website URL of the connected app.
  createdAt: DateTime! # The date and time when the connected app was created.
}

enum ConnectedAppCategory { # The category of a connected app.
  mcp # An MCP client connection.
}

type ContentConfiguration { # Config for one or more content types that share the same properties and rules. Grouping several `configurationContentTypes` in one entry avoids duplicating an identical config (e.g. story + reel).
  configurationContentTypes: [ConfigurationContentType!]! # The content type(s) this config applies to (grouped when rules are identical).
  rules: [ValidationRule!]! # Validation rules that decide whether a draft is valid.
  supportedProperties: [ContentProperty!]! # The properties these content types support; absence means unsupported.
}

type ContentItem { # A piece of content in Buffer. It starts as a channel-less draft and can later become a set of channel-specific posts, or it can be created with its posts directly.  This API is an early preview and can change without a deprecation period.
  id: ContentItemId! # Unique identifier for this content item.
  accountId: AccountId! # Account that owns this content item.
  allowedActions: [ContentItemAction!]! # Actions the calling actor can take on this content item. A client reads this set instead of deriving the authorization rules itself.
  author: Author # The person who created this content item. Null when that person's account no longer exists.
  body: ContentItemBody! # The current content of this item: either a channel-less draft or the channel-specific posts created from it.
  organizationId: OrganizationId! # Organization that owns this content item.
  tags: [Tag!]! # Tags applied to this content item, in the order they were set. A tag applies to the item as a whole, so it survives the move from a channel-less draft to channel-specific posts.
  targetDate: DateTime # Optional date indicating when this piece of content should go out. This is a planning aid only and does not schedule any posts.
  title: String # Optional title describing what this piece of content is about.
  createdAt: DateTime! # When this content item was created.
}

enum ContentItemAction { # Actions the calling actor can take on a `ContentItem`. The server computes this set from the same rules the content item mutations enforce. A client reads it to drive UI affordances instead of deriving the rules itself.  The set carries an action only when a client can offer it on this one item. An action whose answer is the same for every item in a response drives no affordance, so it stays out. Read access is one of those: the API returns only a content item the actor may read.
  deleteContentItem # The actor can delete this content item. An item that holds channel-specific posts gets a second check. The mutation checks each post, so a delete can still fail.
  updateContentItem # The actor can change this content item's title and target date. The actor can also change the tags and the draft text while the item holds a channel-less draft.
}

union ContentItemBody = DraftContent | PostContent # A content item's content: its channel-less draft while it is a draft, or its channel-specific posts once it holds posts. The body shows one or the other, never both, although a content item keeps its draft after it becomes posts.

type ContentItemEdge { # An edge in a content item connection.
  cursor: String! # A cursor for pagination.
  node: ContentItem! # The content item node at the end of the edge.
}

scalar ContentItemId # A unique identifier for a content item.

input ContentItemInput { # Input for fetching a single content item by id.
  id: ContentItemId! # The unique identifier of the content item to fetch.
}

enum ContentItemSortableKey { # Field to sort content items by.
  targetDate # Sort by the content item's target date, the date it is planned for. Content items with no target date sort first in ascending order.
  createdAt # Sort by the date the content item was created.
}

type ContentItemStateError { # updateContentItemDraft and promoteContentItemDraftToPosts need a channel-less draft. They report this error when the item already holds channel-specific posts. Another request can put the item in that state while this one runs.
  message: String! # Error message.
}

enum ContentItemStatus { # The status of a content item's body.
  draftContent # The content item holds a channel-less draft.
  postContent # The content item holds channel-specific posts.
}

type ContentItemsConnection { # A paginated connection of content items.
  edges: [ContentItemEdge!]! # The list of content item edges.
  pageInfo: PaginationPageInfo! # Pagination information for the connection.
  totalCount: Int! # The total number of content items matching the request.
}

input ContentItemsFilter { # Filters for listing content items. Omitted fields do not filter.
  contentStatus: ContentItemStatus # Only return content items with this content status. When omitted, content items in every status are returned.
  tags: TagComparator # Only return content items carrying one of these tags, or, with `isEmpty`, content items with no tags at all. Matches the tags applied to the content item itself, not tags applied later to an individual post.
  targetDate: ContentItemsTargetDateFilter # Only return content items matching this target date filter.
}

input ContentItemsInput { # Input for listing an organization's content items.
  filter: ContentItemsFilter # Filters to apply. When omitted, all of the organization's content items are returned.
  organizationId: OrganizationId! # Organization to list content items for. The caller must be a member of this organization.
  sort: [ContentItemsSortInput!] # Sorting to apply, each entry breaking ties in the one before it. Defaults to newest first. A pagination cursor is only valid for the sort that produced it, so reset `after` to null whenever the sort changes.
}

input ContentItemsSortInput { # One sorting criterion for the content items query. List several to break ties.
  direction: SortDirection! # The direction to sort by.
  field: ContentItemSortableKey! # The field to sort by.
}

input ContentItemsTargetDateFilter { # Filter for a content item's target date. Provide exactly one field (enforced by @oneOf).
  presence: DateTimePresence # Only return content items by whether a target date is set: `present` returns only dated items, `absent` only undated ones.
  range: DateTimeComparator # Only return content items whose target date falls within this range. A range with no bounds returns every content item that has a target date.
}

enum ContentProperty { # A property a content type can carry. Support is expressed by inclusion in `supportedProperties` — there are no exclusion lists. Grows additively.
  board
  document
  firstComment
  gif
  image
  imageAltText
  linkAttachment
  retweetAttachment
  text
  thread
  video
}

type CountRule { # Bounds how many of a property are allowed. `min` null/absent = no lower bound (optional); `min: 1` = required. `max` null = unlimited. At least one of `min` or `max` is always present — a rule that bounds neither is never emitted.
  max: Int # Maximum allowed count. Null = unlimited.
  min: Int # Minimum allowed count. Null = no lower bound (optional).
  property: ContentProperty! # The content property this rule constrains.
}

input CreateCollaborationNoteInput { # The content for a new collaboration Note.
  annotations: [AnnotationInput!] # The annotations for the Note. Omit or pass null to use an empty list.
  subject: CollaborationNoteSubjectInput! # The entity whose Notes thread gets the Note.
  text: String! # The Note text.
}

union CreateCollaborationNotePayload = CreateCollaborationNoteSuccess | InvalidInputError | LimitReachedError | CollaborationNoteThreadClosedError # The possible results from collaboration Note creation.

type CreateCollaborationNoteSuccess { # The result of a successful collaboration Note creation.
  edge: CollaborationNoteEdge! # The new Note and its cursor.
}

type CreateContentItemDraftFailure { # createContentItemDraft failure. When any part of the input is invalid, nothing is created.
  errors: [InvalidInputError!]! # The recoverable errors behind this failure.
  message: String! # Summary error message.
}

input CreateContentItemDraftInput { # Input for createContentItemDraft.
  correlationId: Uuid # Client-generated UUID that makes draft creation idempotent. A retry with the same UUID in the same organization returns the first content item in its current state.
  draft: DraftContentInput! # The channel-less draft content to start with.
  organizationId: OrganizationId! # Organization that will own the content item.
  tagIds: [TagId!] # Tags to apply to this content item. Omit to create it with no tags.
  targetDate: DateTime # Optional date indicating when this piece of content should go out. This is a planning aid only and does not schedule any posts.
  title: String # Optional title describing what this piece of content is about.
}

union CreateContentItemDraftPayload = CreateContentItemDraftSuccess | CreateContentItemDraftFailure # All possible responses for createContentItemDraft.

type CreateContentItemDraftSuccess { # Successful createContentItemDraft response.
  contentItem: ContentItem! # The content item first created for this request, including its current state.
}

union CreateContentItemError = InvalidInputError | NotFoundError | LimitReachedError | CreateContentItemVariantInvalidInputError | CreateContentItemVariantLimitReachedError | CreateContentItemVariantNotFoundError # A recoverable error that prevented a content item from being created. Variant errors identify the specific channel they apply to; the others apply to the request as a whole.

type CreateContentItemFailure { # createContentItem failure. Every recoverable error is reported together so the caller can surface them all at once. When the input fails validation, no content item and no variants are created. When one or more variants fail while being processed after creation, the content item and all of its variants already exist; the per-channel errors identify the variants that need attention.
  errors: [CreateContentItemError!]! # The recoverable errors behind this failure.
  message: String! # Summary error message.
}

input CreateContentItemInput { # Input for createContentItem.
  organizationId: OrganizationId! # Organization that owns the content item and all variants created in it.
  posts: [CreatePostInput!]! # The channel-specific post variants to create, one per channel. Provide at least one variant, and at most one variant per channel.
  tagIds: [TagId!] # Tags to apply to this content item. Omit to create it with no tags.
  targetDate: DateTime # Optional date indicating when this piece of content should go out. This is a planning aid only and does not schedule any posts.
  title: String # Optional title describing what this piece of content is about.
}

union CreateContentItemPayload = CreateContentItemSuccess | CreateContentItemFailure # All possible responses for createContentItem.

type CreateContentItemSuccess { # Successful createContentItem response.
  content: ContentItem! # The content item created by this mutation.
}

type CreateContentItemVariantInvalidInputError { # Invalid input for a single post variant in the createContentItem input list.
  channelId: ChannelId! # Channel targeted by the failing variant.
  message: String! # Error message.
}

