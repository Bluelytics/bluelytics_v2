type Tag { # A label an organization applies to posts and ideas so they can be grouped and filtered together. Tags belong to the organization and are shared by everyone in it, rather than being per channel or per person.
  id: TagId! # The tag's unique identifier.
  color: String! # The tag's color as a hex triplet, for example `#F523F1`. Use `colorName` where you need a stable identifier rather than a literal color.
  colorName: TagColorName # Stable Buffer palette identifier derived from `color`. Clients should map this value to platform- and theme-specific presentation, falling back to `color` when this field is null or unsupported. Returns null for custom or unrecognized colors.
  isLocked: Boolean! # Whether the tag is locked.  A tag locks when the organization holds more tags than its plan allows, typically after a downgrade. Buffer locks the excess rather than deleting it, so nothing is lost if the organization upgrades again.  A locked tag **cannot be edited** — `updateTag` rejects it. It can still be read, deleted, and applied to posts through the API. Buffer's own apps also hide locked tags when picking a tag for a post; that is a client convention, not something the API enforces.  Locking is recalculated when the organization's plan changes, and deleting an unlocked tag frees a slot for the oldest locked one.
  name: String! # The tag's display name, for example `Summer sales`.
}

