type ServiceConfiguration { # Service-level configuration for one supported `service` + `channelType`: its engagement capabilities and `content`. The channel-agnostic baseline — today the same fields as `ChannelConfiguration` minus `channelId` and the per-channel `authorizationStatus`. This overlap is incidental, not a contract: it is a distinct type so the service-level catalog can evolve independently of the per-channel config (either side may add fields the other doesn't share).
