type Query {
  account: Account! # Retrieves the authenticated user's account information
  dailyPostingLimits(input: DailyPostingLimitsInput!): [DailyPostingLimitStatus!]! # Returns posting limit status for the given channels at the intended posting time.
  channel(input: ChannelInput!): Channel! # Fetches a single channel using the provided ID
  channels(input: ChannelsInput!): [Channel!]! # Fetch all channels for the organization taking into account the current's user permissions
  aggregatedPostMetrics(input: AggregatedPostMetricsInput!): AggregatedPostMetrics! # Aggregate normalized post metrics across a filtered post set. Useful for yearly summaries, channel-level rollups, and BI exports without paginating through thousands of posts.  For per-post metrics, use `posts(input)` or `post(input)` with a `metrics { … }` selection — this query is purely for aggregation.  The result always contains a baseline trio of entries: `postCount` (number of matched posts in the window), `reactions`, and `comments`. Posts on networks that don't track reactions or comments contribute 0 to those totals.  Beyond the baseline, additional metric types are returned only when every channel in the filter set supports them. A single-network filter surfaces that network's richer metrics (e.g. impressions, reach, engagementRate on LinkedIn); a mixed-network filter trims the extras to those common to every network in the set.
  snippets(after: String, first: Int, input: SnippetsInput!): SnippetsConnection! # Returns the snippets of an organization, sorted by name. Uses standard cursor pagination: pass the previous page's `pageInfo.endCursor` as `after` to fetch the next page. Requesting more than 100 snippets in a single page is rejected. A cursor whose snippet was deleted reports a BAD_USER_INPUT error. Fetch again from the first page.
  collaborationNotes(after: String, first: Int, input: CollaborationNotesInput!): CollaborationNotesConnection! # The authorized Notes in a thread, in descending creation order.
  post(input: PostInput!): Post! # Fetches a post by PostID for the given organization: first and last can be set for forward pagination using Relay convention
  posts(after: String, first: Int, input: PostsInput!): PostsResults! # Fetches posts for the given organization: first and last can be set for forward pagination using Relay convention
  contentItem(input: ContentItemInput!): ContentItem! # Fetch a single content item by id. Errors if no content item with that id exists.  This API is an early preview and can change without a deprecation period.
  contentItems(after: String, first: Int, input: ContentItemsInput!): ContentItemsConnection! # Fetch an organization's content items in the requested order, newest first by default. Uses standard cursor pagination: pass the previous page's `pageInfo.endCursor` as `after` to fetch the next page. Requesting more than 100 items in a single page is rejected.  This API is an early preview and can change without a deprecation period.
  tag(input: TagByIdInput!): Tag # Fetch a single tag by id.  Resolves to null with a NOT_FOUND error when no tag has that id, and with an UNAUTHORIZED error when the tag belongs to an organization the caller cannot read. Both are reported in the errors array.  This API is an early preview and can change without a deprecation period.
  tagsV2(after: String, first: Int, input: TagsInput!): TagsConnection! # Fetch a page of the organization's tags, sorted by name in ascending order. Uses standard cursor pagination: pass the previous page's `pageInfo.endCursor` as `after` to fetch the next page. Requesting more than 100 tags in a single page is rejected.  This API is an early preview and can change without a deprecation period.
  selectableTeamMembers(after: String, first: Int, input: SelectableTeamMembersInput!): SelectableTeamMembersConnection! # The team members the requesting account may offer for selection, ordered by display name and then by account ID. On an organization with Roles, a locked member with an assigned role remains eligible in both scopes, because the lock keeps viewer-level access. Locked members without a role, and those in organizations without Roles, are excluded from both scopes. Backs the @-mention picker in Notes and is reusable for any other member picker.  The list is live rather than snapshotted, and the sort key is a display name, so a member renamed while a client is paging can arrive twice or be missed. Merge pages by node ID if that matters.
  instagramAudio(input: InstagramAudioInput!): InstagramAudioPayload! # Refresh metadata and preview availability for one Instagram audio asset. Requires Facebook Login. Instagram Login channels return ChannelRefreshRequired.
  searchInstagramAudio(input: SearchInstagramAudioInput!): SearchInstagramAudioPayload! # Search Instagram audio for one channel. Requires Facebook Login. Instagram Login channels return ChannelRefreshRequired.
  trendingInstagramAudio(input: TrendingInstagramAudioInput!): SearchInstagramAudioPayload! # Return Meta trending Instagram audio for one channel. Requires Facebook Login. Instagram Login channels return ChannelRefreshRequired.
  instagramAudioCatalog(input: InstagramAudioCatalogInput!): InstagramAudioCatalogPayload! # Return trending music and original sounds in a single request. Requires Facebook Login. Instagram Login channels return ChannelRefreshRequired.
  searchInstagramAudioCatalog(input: SearchInstagramAudioCatalogInput!): InstagramAudioCatalogPayload! # Search music and original sounds in a single request. Requires Facebook Login. Instagram Login channels return ChannelRefreshRequired.
  configuration(input: ConfigurationInput!): Configuration! # Global, per-organization configuration: the connected `channels` the actor can view (with per-feature authorization) plus the service-level capability catalog (`services`). One round trip for every capability domain; clients select only what they need.
  postTemplate(input: PostTemplateInput!): PostTemplate # Fetch a single post template by ID. Returns null if not found.
  postTemplates(after: String, first: Int, input: PostTemplatesInput!): PostTemplatesConnection! # Fetch the templates visible to the current actor for the template library: public templates, plus internal templates from the supplied `organizationId`, plus private templates owned by the actor's account. The visibility scope is always pinned to the actor and the supplied organization — the input filter can only narrow within that scope, never widen it.
  ideaGroups(input: IdeaGroupsInput!): [IdeaGroup!]! # Retrieves idea groups based on the provided input parameters.
  ideas(after: String, first: Int, input: IdeasInput!): IdeasConnection! # Fetch a paginated list of ideas with optional filtering
}

