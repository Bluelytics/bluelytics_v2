name: bluelytics
description: "Dólar blue y oficial de Argentina, en vivo."
publish_to: 'none'

# version: <name>+<build>. The build number is the Android versionCode and the iOS CFBundleVersion.
# It starts above 4.194.312: the React Native builds were uploaded per ABI with codes of the form
# abi × 1.048.576 + 8, and Google Play only accepts a higher code than any it has seen for the package.
# Keep lib/config.dart `appVersion` equal to <name> (test/config_test.dart checks it).
version: 2.0.0+5000000

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  # The app draws its own icons (lib/widgets/glyphs.dart); this only keeps the few glyphs Material
  # widgets use internally (text selection menus), tree-shaken to those.
  uses-material-design: true

  assets:
    - assets/brand/mark.png

  fonts:
    # Variable fonts (wght 100–900), SIL OFL 1.1 (assets/fonts/OFL.txt). Weights are selected with
    # `FontVariation('wght', …)` in lib/theme/type.dart.
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "tool/art/icon-1024.png"
  adaptive_icon_background: "#040A14"
  adaptive_icon_foreground: "tool/art/icon-foreground-1024.png"
  adaptive_icon_monochrome: "tool/art/icon-monochrome-1024.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#040A14"
  image: "tool/art/splash-mark.png"
  android_12:
    color: "#040A14"
    image: "tool/art/splash-android12.png"
  ios: true
  android: true
  fullscreen: false
